name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A healthy run takes ~4 min; never let a hang burn an hour.
    timeout-minutes: 20
    env:
      # E2E tests mock this exact project URL; nothing real is called.
      VITE_SUPABASE_URL: https://zplkfmuulfhftjmgmddi.supabase.co
      VITE_SUPABASE_ANON_KEY: e2e-dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # tsc -b follows the project references; plain `tsc --noEmit` on the
      # root tsconfig checks no files at all.
      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload E2E results (screenshots, diffs, traces)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
